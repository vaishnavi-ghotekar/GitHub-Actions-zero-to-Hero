name: Portfolio

on:
    push:
        branches: [main]
 
permissions:
    pages: write   # to deploy to github pages
    id-token: write        

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: 
            name: github-pages
            url: ${{ steps.deploy-pages.outputs.page_url }}
        steps:
            # get access to your portfolio code via a pre-built actions
            # clones or checkout the code where this workflow is wrtten
            # STEP 1
            - name: checkout code
              uses: actions/checkout@v4

            # setup a github pages
            - name : setupp a github pages 
              uses: actions/configure-pages@v4 

            # static code artifacts 
            - name: upload static files
              uses: actions/upload-pages-artifact@v4

            # deploy to github pages / make page live
            - name: deploy to github pages
              uses: actions/deploy-pages@v4 
